<!DOCTYPE html>
<html lang="ko"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소개</title>
  <style>
    /* Global Styles & Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background: linear-gradient(180deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      padding-bottom: 60px;
    }

    /* Ocean Background Elements (Bubbles & Fish) */
    .ocean-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bubble {
      position: absolute;
      bottom: -50px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      animation: rise 8s infinite linear;
    }

    @keyframes rise {
      0% {
        transform: translateY(0) scale(0.8);
        opacity: 0.5;
      }
      50% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-110vh) scale(1.2);
        opacity: 0;
      }
    }

    /* Floating Fish SVG Animations */
    .swimming-fish {
      position: absolute;
      opacity: 0.7;
      animation: swim linear infinite;
    }

    @keyframes swim {
      0% { transform: translateX(-100px) scaleX(1); }
      50% { transform: translateX(calc(100vw + 100px)) scaleX(1); }
      50.1% { transform: translateX(calc(100vw + 100px)) scaleX(-1); }
      100% { transform: translateX(-100px) scaleX(-1); }
    }

    /* Main Container */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    /* Header Section */
    header {
      text-align: center;
      margin-top: 20px;
      margin-bottom: 30px;
    }

    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      border: 1px solid rgba(255, 255, 255, 0.3);
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      text-shadow: 0 4px 12px rgba(0,0,0,0.4);
      background: linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #e0f7fa;
      font-size: 1.05rem;
    }

    /* Section Cards (Glassmorphism) */
    .card-section {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 30px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #80deea;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }

    /* Visitor Name Welcome Section */
    .welcome-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .input-group {
      display: flex;
      width: 100%;
      max-width: 400px;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(0, 0, 0, 0.2);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: #80deea;
      box-shadow: 0 0 10px rgba(128, 222, 234, 0.5);
    }

    input[type="text"]::placeholder {
      color: #b0bec5;
    }

    button.btn {
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #00b4db 0%, #0083b0 100%);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 180, 219, 0.3);
      white-space: nowrap;
    }

    button.btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 180, 219, 0.5);
    }

    button.btn:active {
      transform: translateY(0);
    }

    .welcome-message {
      font-size: 1.15rem;
      font-weight: 600;
      color: #ffe082;
      min-height: 1.5em;
      text-align: center;
      margin-top: 5px;
      animation: fadeIn 0.5s ease;
    }

    /* Favorite Things 3D Flip Cards */
    .favorites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .flip-card {
      background-color: transparent;
      height: 200px;
      perspective: 1000px;
      cursor: pointer;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 16px;
    }

    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .flip-card-front {
      background: linear-gradient(145deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
    }

    .flip-card-front .icon {
      font-size: 3.5rem;
      margin-bottom: 10px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }

    .flip-card-front .title {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .flip-card-front .hint {
      font-size: 0.75rem;
      color: #b0bec5;
      margin-top: 8px;
    }

    .flip-card-back {
      background: linear-gradient(145deg, #1e3c72 0%, #2a5298 100%);
      color: white;
      transform: rotateY(180deg);
    }

    .flip-card-back p {
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: keep-all;
    }

    /* Quiz Section */
    .quiz-container {
      text-align: center;
    }

    .quiz-question {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .quiz-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 15px;
    }

    .quiz-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      font-size: 2rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    }

    .quiz-btn-o {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      color: #d81b60;
    }

    .quiz-btn-x {
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
      color: #1565c0;
    }

    .quiz-btn:hover {
      transform: scale(1.1);
    }

    .quiz-result {
      font-size: 1.1rem;
      font-weight: 700;
      min-height: 2em;
      margin-top: 10px;
    }

    /* Fortune Teller Section */
    .fortune-container {
      text-align: center;
    }

    .fortune-card-display {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 16px;
      padding: 20px;
      margin-top: 15px;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed rgba(255, 255, 255, 0.3);
      transition: all 0.3s ease;
    }

    .fortune-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: #80ffd3;
      line-height: 1.4;
      word-break: keep-all;
    }

    /* Confetti Particle Styles */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      z-index: 999;
      pointer-events: none;
      animation: fall 3s ease-out forwards;
    }

    @keyframes fall {
      0% {
        transform: translateY(-10vh) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Shake Effect for Quiz Failure */
    .shake {
      animation: shakeAnim 0.5s ease-in-out;
    }

    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }

    /* Responsive Tweaks */
    @media (max-width: 480px) {
      h1 { font-size: 2rem; }
      .container { padding: 12px; }
      .card-section { padding: 18px; }
      .favorites-grid { grid-template-columns: 1fr; }
      .flip-card { height: 160px; }
    }
  </style>
